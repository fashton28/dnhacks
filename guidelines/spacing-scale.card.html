<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid. Dense control-surface rhythm." -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:var(--bg-app)}
  body{padding:20px 22px;font-family:var(--font-sans);display:flex;gap:14px;align-items:flex-end}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .box{background:var(--accent);border-radius:var(--radius-xs)}
  .n{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)}
  .t{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary)}
</style></head>
<body>
<div id="root" style="display:flex;gap:14px;align-items:flex-end"></div>
<script>
const s=[['1','4'],['2','8'],['3','12'],['4','16'],['5','20'],['6','24'],['7','32'],['8','40'],['9','48']];
document.getElementById('root').innerHTML=s.map(([k,px])=>`<div class="cell"><div class="box" style="width:${px}px;height:${px}px"></div><span class="n">${px}</span><span class="t">--space-${k}</span></div>`).join('');
</script>
</body></html>
