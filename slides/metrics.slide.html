<!-- @dsCard group="Slides" viewport="1280x720" name="Metrics slide" subtitle="Big tabular telemetry figures — the brand's data voice" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  .slide{width:1280px;height:720px;background:var(--bg-app);position:relative;overflow:hidden;font-family:var(--font-sans);color:var(--text-primary);padding:88px 96px;box-sizing:border-box;display:flex;flex-direction:column}
  .kick{font-family:var(--font-mono);font-size:14px;letter-spacing:.22em;color:var(--accent-text);text-transform:uppercase}
  h2{margin:14px 0 0;font-size:46px;font-weight:700;letter-spacing:-.015em}
  .grid{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--border-default)}
  .cell{padding:34px 26px 8px 0;border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:10px}
  .cell:last-child{border-right:none}
  .lab{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
  .val{font-family:var(--font-mono);font-size:62px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
  .u{font-size:24px;color:var(--text-tertiary)}
  .note{font-size:13px;color:var(--text-secondary)}
  .foot{margin-top:40px;display:flex;align-items:center;gap:12px;color:var(--text-tertiary);font-family:var(--font-mono);font-size:13px}
</style></head>
<body>
<div class="slide">
  <span class="kick">Performance envelope</span>
  <h2>Built to hold a person in frame</h2>
  <div class="grid">
    <div class="cell"><span class="lab">Standoff range</span><span class="val">2–15<span class="u"> m</span></span><span class="note">Operator-tunable in flight</span></div>
    <div class="cell"><span class="lab">Max approach</span><span class="val">8.0<span class="u"> m/s</span></span><span class="note">Speed cap, hard-limited</span></div>
    <div class="cell"><span class="lab">Telemetry rate</span><span class="val">10<span class="u"> Hz</span></span><span class="note">Glanceable, no jitter</span></div>
    <div class="cell"><span class="lab">Lock confidence</span><span class="val">94<span class="u"> %</span></span><span class="note">Per-target, live</span></div>
  </div>
  <div class="foot"><img src="../assets/logo-mark.svg" width="18" height="18" alt="" />EYE IN THE SKY · GROUND CONTROL</div>
</div>
</body></html>
