<!-- @dsCard group="Slides" viewport="1280x720" name="Title slide" subtitle="Cover — reticle motif, wordmark, mono kicker" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  .slide{width:1280px;height:720px;background:var(--bg-app);position:relative;overflow:hidden;font-family:var(--font-sans);color:var(--text-primary)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px}
  .reticle{position:absolute;right:-160px;top:50%;transform:translateY(-50%);width:620px;height:620px;opacity:.5}
  .glow{position:absolute;right:-40px;top:50%;transform:translateY(-50%);width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(47,129,247,.16),transparent 62%)}
  .body{position:absolute;left:88px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:26px;max-width:720px}
  .kick{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:14px;letter-spacing:.28em;color:var(--accent-text);text-transform:uppercase}
  h1{margin:0;font-size:76px;font-weight:700;letter-spacing:-.02em;line-height:1.02}
  .sub{font-size:21px;color:var(--text-secondary);line-height:1.5;max-width:560px}
  .foot{position:absolute;left:88px;bottom:54px;display:flex;align-items:center;gap:16px;color:var(--text-tertiary);font-family:var(--font-mono);font-size:13px}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--gray-7)}
</style></head>
<body>
<div class="slide">
  <div class="grid"></div>
  <div class="glow"></div>
  <img class="reticle" src="../assets/logo-mark.svg" alt="" />
  <div class="body">
    <span class="kick"><span style="width:22px;height:1px;background:var(--accent-text)"></span>Autonomous follow-me drone</span>
    <h1>Eye in the<br/>Sky</h1>
    <p class="sub">A ground control center for a person-following quadcopter — glanceable telemetry, live tracking, and safety-first command.</p>
  </div>
  <div class="foot">
    <img src="../assets/logo-mark.svg" width="20" height="20" alt="" />
    <span>GROUND CONTROL</span><span class="dot"></span><span>v2.4 · SITL</span>
  </div>
</div>
</body></html>
