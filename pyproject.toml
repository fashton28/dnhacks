[project]
name = "argus"
version = "0.1.0"
description = "ARGUS: simulated autonomous site monitoring for critical infrastructure"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "numpy>=1.26",
    "pillow>=10",
    "shapely>=2.0",
    "pyproj>=3.6",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "empy==3.3.4",
    "future>=1.0.0",
    "mavproxy>=1.8.74",
    "pexpect>=4.9.0",
    "playwright>=1.62.0",
    "pymavlink>=2.4.49",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts", "hub", "sim", "widearea", "agent", "safety", "planner", "redteam"]
