# ============================================================================
# Eye in the Sky -- COMPANION (Jetson) Python package.
#
# Packaging notes (PRD 7, reproducibility):
#   * Every runtime dependency is PINNED to an exact version below.
#   * torch / torchvision / TensorRT are NOT pip dependencies: on the Jetson
#     Orin Nano they come from NVIDIA JetPack (L4T) -- pip-installing them would
#     pull a non-CUDA wheel and break GPU inference. They are therefore declared
#     ONLY as an optional extra ([jetson]) for documentation, and the heavy ML
#     stack (ultralytics) is also an extra so the control + sim stack installs
#     cleanly on a plain dev box. The core install runs SITL with no GPU.
#
# Install profiles:
#   pip install -e .            # core: mavlink + api + sim + control (dev box, SITL)
#   pip install -e .[detect]    # + ultralytics/opencv for real person detection
#   pip install -e .[dev]       # + pytest for the test suite
#   pip install -e .[jetson]    # documents the JetPack-provided GPU stack
# ============================================================================
[build-system]
requires = ["setuptools>=69.5.1", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eis-companion"
version = "0.1.0"
description = "Eye in the Sky -- Jetson companion software for an autonomous person-following drone."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eye in the Sky" }]
keywords = ["drone", "ardupilot", "mavlink", "jetson", "person-following", "visual-servoing"]

# --- Core runtime dependencies (PINNED). Enough to run SITL + the contract --
# API + the pure-logic control core on a plain dev box (no GPU, no camera).
dependencies = [
  "pymavlink==2.4.41",       # FC MAVLink link (serial on HW, UDP in SITL)
  "websockets==12.0",        # control + telemetry WebSocket server
  "numpy==1.26.4",           # tracker Kalman + guidance math (pure-logic core)
  "pyyaml==6.0.1",           # config/*.yaml loader
  "python-dotenv==1.0.1",    # .env overrides
]

[project.optional-dependencies]
# Real person detection + frame I/O (heavier; not needed for the SITL sim path).
detect = [
  "opencv-python==4.9.0.80",
  "ultralytics==8.2.0",      # YOLO11n person detector (COCO 'person' class)
]
# Test suite (pure-logic + config + API unit tests; no hardware).
dev = [
  "pytest==8.2.0",
  "hypothesis==6.100.1",   # property tests for the planner executor safety clamps
  "ruff==0.6.9",
  "pyflakes==3.2.0",
]
# Jetson / JetPack note: torch, torchvision, and TensorRT are provided by
# NVIDIA JetPack (L4T) on the Orin Nano -- do NOT pip install them there. These
# pins are for a non-Jetson CUDA dev box ONLY and are intentionally optional so
# the core install never drags them in. On the Jetson, install [detect] but let
# the system torch/TensorRT satisfy the GPU stack.
jetson = [
  "torch==2.3.0",
  "torchvision==0.18.0",
  "onnx==1.16.0",            # YOLO -> ONNX -> TensorRT export step
]

[project.scripts]
eis-companion = "eis_companion.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the bundled stream config + the YAML configs with the package.
"eis_companion.stream" = ["mediamtx.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
