###############################################################################
# Eye in the Sky -- COMPANION default configuration (REAL HARDWARE / Jetson).
#
# Conservative, safety-first defaults (PRD 9 / 11). Every value here can be
# overridden by an EIS_* environment variable (see .env.example) and is clamped
# to the hard safety envelope by config.py (standoff floor 3 m, max-speed cap
# 8 m/s) -- you cannot accidentally configure an unsafe vehicle.
#
# Use config/sitl.yaml for simulation (UDP FC link + synthetic 'sim' camera).
###############################################################################

# Real flights are NOT SITL.
sitl: false

# --- Hard safety + tuning envelope (eis_companion.types.Limits) ------------
limits:
  max_speed:            2.0     # m/s horizontal (conservative; hard cap 8)
  min_speed:            0.5     # m/s
  max_climb_rate:       1.5     # m/s
  max_yaw_rate:         45.0    # deg/s
  max_altitude:         30.0    # m  (also the FC geofence altitude cap)
  standoff:             5.0     # m  configured target distance
  min_standoff:         3.0     # m  HARD floor -- never approaches closer
  deadzone:             0.09    # normalised manual-stick deadzone
  manual_watchdog_ms:   500     # zero+hold if no stick frame within this
  ground_link_timeout_ms: 2000  # deadman on the ground link

# --- Visual-servoing PID gains (gentle defaults, PRD 9) --------------------
guidance:
  gains:
    yaw:      { kp: 90.0, ki: 0.0, kd: 4.0 }   # horiz centroid err -> yaw rate (deg/s)
    altitude: { kp: 2.0,  ki: 0.0, kd: 0.1 }   # vert centroid err  -> climb rate (m/s)
    forward:  { kp: 0.6,  ki: 0.0, kd: 0.05 }  # distance err        -> fwd vel (m/s)

# --- Camera / capture (Jetson CSI by default) ------------------------------
camera:
  source:   csi            # csi (nvarguscamerasrc) | v4l2 | file | sim | mock
  device:   /dev/video0    # used when source == v4l2
  width:    1280
  height:   720
  fps:      30
  vfov_deg: 41.0           # vertical FOV (IMX219-class @ 720p) -> distance est.

# --- Person detector -------------------------------------------------------
detector:
  model_path:      weights/yolo11n.pt        # pretrained COCO person detector
  engine_path:     weights/yolo11n.engine    # exported TensorRT engine (Jetson)
  conf:            0.4
  person_height_m: 1.7                        # assumed height for distance est.

# --- Single-target tracker -------------------------------------------------
tracking:
  lost_timeout:  1.0       # s the locked track may coast before 'lost'
  max_age:       1.5       # s a track may coast before deletion
  iou_threshold: 0.3
  min_hits:      2

# --- Network: control WS + video ports -------------------------------------
network:
  host:               0.0.0.0
  control_port:       8765   # control + telemetry WebSocket
  video_port:         8554   # RTSP (mediamtx)
  webrtc_port:        8889   # WebRTC/WHEP (low-latency UI)
  video_bitrate_kbps: 2500
  video_url:          ""     # advertised URL; "" => derive rtsp://host:8554/stream

# --- Flight-controller MAVLink link (real HW: Jetson UART) -----------------
fc:
  connection: /dev/ttyTHS1   # Jetson Orin Nano UART to the FC
  baud:       921600
  sysid:      1              # FC system id
  gcs_sysid:  255            # this companion's GCS system id

# --- Safety / failsafe actions + geofence ----------------------------------
safety:
  geofence_radius_m:      60.0
  low_battery_action:     rtl    # warn -> RTL -> LAND ladder
  critical_battery_action: land
  min_battery_remaining:  20.0   # % gate enforced at arming
  rc_override_primacy:    true   # documented invariant; never disabled
