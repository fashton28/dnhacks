################################################################################ Drone Safety Platform -- COMPANION SITL configuration (SIMULATION / dev box).#
# For the SITL-first acceptance demo (PRD 10/13): ArduPilot SITL over UDP + a
# synthetic 'sim' camera source feeding the tracking/guidance loop, so the whole
# stack runs with ZERO hardware and no camera.
#
#   EIS_CONFIG=config/sitl.yaml python -m eis_companion.app
#
# Inherits the same conservative safety envelope as default.yaml; only the FC
# link (UDP) and the camera source (sim, no video stream) differ.
###############################################################################

# This IS simulation.
sitl: true
vehicle_id: eis-1

# --- Hard safety + tuning envelope (same conservative limits as real) ------
limits:
  max_speed:            2.0
  min_speed:            0.5
  max_climb_rate:       1.5
  max_yaw_rate:         45.0
  max_altitude:         80.0
  standoff:             5.0
  min_standoff:         3.0
  deadzone:             0.09
  manual_watchdog_ms:   500
  ground_link_timeout_ms: 2000

# --- Visual-servoing PID gains ---------------------------------------------
guidance:
  gains:
    yaw:      { kp: 90.0, ki: 0.0, kd: 4.0 }
    altitude: { kp: 2.0,  ki: 0.0, kd: 0.1 }
    forward:  { kp: 0.6,  ki: 0.0, kd: 0.05 }

# --- Camera: synthetic sim target (no real camera, no video stream) --------
camera:
  source:   sim            # SimTargetSource feeds synthetic person detections
  width:    1280
  height:   720
  fps:      30
  vfov_deg: 41.0

# --- Detector (unused with source=sim, kept for parity) --------------------
detector:
  model_path:      weights/yolo11n.pt
  engine_path:     weights/yolo11n.engine
  conf:            0.4
  person_height_m: 1.7

# --- Single-target tracker -------------------------------------------------
tracking:
  lost_timeout:  1.0
  max_age:       1.5
  iou_threshold: 0.3
  min_hits:      2

# --- Network: control WS + video ports -------------------------------------
network:
  # LOOPBACK BY DEFAULT (FM-40). The control WebSocket takes arm / takeoff /
  # executePlan / emergencyStop, and every real client runs on this machine.
  # Set this to 0.0.0.0 (or EIS_BIND_ALL=true) ONLY with a reason: doing so
  # automatically forces security.require_signed_commands on, because a socket
  # the venue LAN can reach must authenticate every frame.
  host:               127.0.0.1
  control_port:       8765
  video_port:         8554
  webrtc_port:        8889
  video_bitrate_kbps: 2500
  video_url:          ""     # empty in SITL -> UI renders its mock canvas

# --- Flight-controller MAVLink link (SITL: UDP) ----------------------------
fc:
  connection: udp:127.0.0.1:14550   # ArduPilot SITL MAVLink out
  baud:       921600                # ignored for udp
  sysid:      1
  gcs_sysid:  255

# --- Safety / failsafe actions + geofence ----------------------------------
safety:
  geofence_radius_m:      60.0
  low_battery_action:     rtl
  critical_battery_action: land
  min_battery_remaining:  20.0
  rc_override_primacy:    true

battery:
  nominal_endurance_s:    1500
  reserve_pct:            25
  max_sortie_s:           480
  dispatch_min_soc_pct:   80
  cell_imbalance_max_v:   0.10
  batt_temp_max_c:        60
  capacity_mah:           5000
  # 3S DELIBERATELY, and only here: ArduPilot SITL simulates a 12.6 V pack,
  # which is 4.2 V/cell on 3S (full) but 3.15 V/cell on 4S (empty) -- reading
  # it as 4S would refuse every arm. The real airframe in default.yaml is 4S.
  # Every voltage-derived FC threshold (BATT_LOW_VOLT / BATT_CRT_VOLT) is
  # DERIVED from this number and pushed at connect by
  # Vehicle.apply_failsafe_params, so the firmware and the companion always
  # describe the same pack -- sim/params/eis-sitl.parm's 4S literals are
  # overwritten rather than silently disagreeing (FM-156 / FM-16).
  cell_count:             3
  demo_charge_scale_s:    30
  estimated_return_s:     30

# --- Mission planner (power-plant security retrofit) ------------------------
# NOTE: emitted plan speeds are additionally capped at limits.max_speed (2.0
# above) and goto altitudes at limits.max_altitude (80.0 in THIS file -- the
# site alt_band is 20-80 m, so the band is what binds, not the limit). Keep
# this number and limits.max_altitude in step: they were 80 and "30" for a
# while, which is how a reader ends up planning against the wrong ceiling.
# The FIRMWARE ceiling must match too: sim/params/eis-sitl.parm FENCE_ALT_MAX
# is pushed from limits.max_altitude at connect (Vehicle.apply_failsafe_params).
planner:
  profile_speed_mps: { follow: 2.0, inspect: 4.0, survey: 6.0, slow: 2.0, standard: 4.0, fast: 6.0 }
  site_file: ""                   # "" -> EIS_SITE_FILE env, else site/site.json
  arrival_radius_m: 2.0
  staging_arrival_radius_m: 15.0
  heartbeat_timeout_ms: 2000
