appId: com.dnhacks.platform.groundcontrol
productName: Drone Safety Platform
copyright: Copyright © DNHacks

# Where electron-builder finds the compiled main/preload
directories:
  output: dist-installer
  buildResources: build-resources

# Files included in the final package (relative to project root)
files:
  - dist-electron/**/*
  - "!../../ui/node_modules"
  - "!../../ui/src"
  - "!../../ui/.git"

# The built React UI is bundled as an extra resource so main.ts can
# reference it at runtime regardless of asar packing.
extraResources:
  - from: "../../ui/dist"
    to: "ui/dist"
    filter:
      - "**/*"
  # Site model (JSON + staging stills) — read by ipc.ts 'site:load' at
  # process.resourcesPath/site (docs/SITE_CONTRACT.md paths are repo-root-relative).
  - from: "../../../site"
    to: "site"
    filter:
      - "**/*"
  # NOTE (FM-148): the baked satellite tiles are NOT copied here. They are
  # already in the renderer bundle (SatellitePanel imports them through the
  # @satdata Vite alias), and the 'satellite:loadTiles' handler that read this
  # copy was dead code — ~870 KB of PNG in every installer for an IPC channel
  # nothing invoked. Both have been removed.
  - from: "../../planner"
    to: "ground/planner"
    filter:
      - "dist/**/*"
      - "package.json"
      - "node_modules/openai/**/*"
      - "node_modules/zod/**/*"
  - from: "../../sdr"
    to: "ground/sdr"
    filter:
      - "**/*.py"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build-resources/icon.ico
  # We do not code-sign here. Skipping the sign/edit step avoids electron-builder
  # downloading + extracting the winCodeSign bundle (whose macOS .dylib symlinks
  # fail to extract on Windows accounts without the create-symlink privilege /
  # Developer Mode). Provide a real cert + CSC_LINK in CI/release to sign.
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build-resources/icon.ico
  uninstallerIcon: build-resources/icon.ico
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Drone Safety Platform

# Prevent electron-builder from signing on dev machines without a cert
# (remove or set to true when you have a Windows code-signing cert)
forceCodeSigning: false
