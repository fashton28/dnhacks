<!-- @dsCard group="Type" viewport="700x200" name="Geist — body & UI labels" subtitle="Body text + the uppercase micro-label used on every panel & readout." -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:var(--bg-app)}
  body{padding:18px 22px;font-family:var(--font-sans);color:var(--text-primary)}
  .r{display:flex;align-items:baseline;gap:14px;margin-bottom:11px}
  .m{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);white-space:nowrap;margin-left:auto}
  .lab{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary)}
</style></head>
<body>
<div class="r"><span style="font-size:14px;font-weight:500">Emphasised body — control labels and key copy</span><span class="m">14px · 500 · md</span></div>
<div class="r"><span style="font-size:13px;color:var(--text-secondary)">Default body. The pilot scans this at a glance; keep it terse and literal.</span><span class="m">13px · 400 · base</span></div>
<div class="r"><span style="font-size:12px;color:var(--text-secondary)">Secondary — table cells, captions, helper text</span><span class="m">12px · 400 · sm</span></div>
<div class="r"><span class="lab">Battery · GPS Fix · Standoff</span><span class="m">10px · 600 · label · 0.06em</span></div>
</body></html>
