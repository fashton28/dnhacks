<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="Tight, instrument-like. Pills only for status chips." -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:var(--bg-app)}
  body{padding:20px 22px;font-family:var(--font-sans);display:flex;gap:18px;align-items:flex-start}
  .cell{display:flex;flex-direction:column;align-items:center;gap:7px}
  .box{width:64px;height:48px;background:var(--surface-input);border:1px solid var(--border-strong)}
  .n{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)}
  .t{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary)}
</style></head>
<body>
<div id="root" style="display:flex;gap:18px"></div>
<script>
const r=[['xs','3'],['sm','5'],['md','7'],['lg','10'],['xl','14'],['pill','999']];
document.getElementById('root').innerHTML=r.map(([k,px])=>`<div class="cell"><div class="box" style="border-radius:${px==='999'?'999px':px+'px'}"></div><span class="n">${px==='999'?'pill':px+'px'}</span><span class="t">--radius-${k}</span></div>`).join('');
</script>
</body></html>
