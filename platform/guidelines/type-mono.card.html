<!-- @dsCard group="Type" viewport="700x210" name="JetBrains Mono — telemetry readouts" subtitle="Tabular figures for every live number — digits never jitter as they change." -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:var(--bg-app)}
  body{padding:18px 22px;font-family:var(--font-sans)}
  .grid{display:flex;gap:30px;align-items:flex-end;margin-bottom:14px}
  .cell{display:flex;flex-direction:column;gap:4px}
  .lab{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary)}
  .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-primary);font-weight:500;line-height:1}
  .u{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}
  .note{font-size:11px;color:var(--text-tertiary);font-family:var(--font-mono)}
</style></head>
<body>
<div class="grid">
  <div class="cell"><span class="lab">Rel Alt</span><span class="v" style="font-size:44px">42.7<span class="u"> m</span></span></div>
  <div class="cell"><span class="lab">Distance</span><span class="v" style="font-size:32px">6.4<span class="u"> m</span></span></div>
  <div class="cell"><span class="lab">Speed</span><span class="v" style="font-size:22px">3.42<span class="u"> m/s</span></span></div>
  <div class="cell"><span class="lab">Sats</span><span class="v" style="font-size:15px">14</span></div>
</div>
<div class="note">0123456789 · tnum + zero · 33.7421°N · 118.1937°W · 14.2V · −1.2 m/s</div>
</body></html>
