<!-- @dsCard group="Colors" viewport="700x210" name="Status semantics" subtitle="green=nominal · amber=caution · red=danger · grey=inactive. Consistent everywhere." -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:var(--bg-app)}
  body{padding:18px 20px;font-family:var(--font-sans)}
  .row{display:flex;gap:12px}
  .col{flex:1;display:flex;flex-direction:column;gap:6px}
  .bar{height:44px;border-radius:var(--radius-sm);display:flex;align-items:center;padding:0 12px;font-weight:600;font-size:13px}
  .tints{display:flex;gap:6px}
  .t{flex:1;height:26px;border-radius:var(--radius-xs);border:1px solid;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .meta{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary)}
  .head{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}
</style></head>
<body>
<div class="row">
  <div class="col">
    <span class="head">Nominal · safe</span>
    <div class="bar" style="background:var(--green);color:#04140b">Armed · GPS 3D</div>
    <div class="t" style="background:var(--green-tint);border-color:var(--green-line);color:var(--green-bright)">tint</div>
    <span class="meta">--nominal #25c46d</span>
  </div>
  <div class="col">
    <span class="head">Caution</span>
    <div class="bar" style="background:var(--amber);color:#1a1205">Battery 28%</div>
    <div class="t" style="background:var(--amber-tint);border-color:var(--amber-line);color:var(--amber-bright)">tint</div>
    <span class="meta">--caution #f5a623</span>
  </div>
  <div class="col">
    <span class="head">Danger · critical</span>
    <div class="bar" style="background:var(--red);color:#fff">Link lost · Disarm</div>
    <div class="t" style="background:var(--red-tint);border-color:var(--red-line);color:var(--red-bright)">tint</div>
    <span class="meta">--danger #f04438</span>
  </div>
  <div class="col">
    <span class="head">Inactive</span>
    <div class="bar" style="background:var(--gray-4);color:var(--text-secondary);border:1px solid var(--border-default)">Disarmed · idle</div>
    <div class="t" style="background:rgba(255,255,255,.05);border-color:var(--border-default);color:var(--text-tertiary)">neutral</div>
    <span class="meta">--inactive #475160</span>
  </div>
</div>
</body></html>
