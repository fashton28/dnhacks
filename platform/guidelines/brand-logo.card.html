<!-- @dsCard group="Brand" viewport="700x240" name="Logo & lockups" subtitle="Reticle mark + wordmark. The mark fuses a camera aperture with a target lock." -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:var(--bg-app)}
  body{padding:0;font-family:var(--font-sans)}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .cell{padding:22px 24px;display:flex;flex-direction:column;gap:14px;justify-content:center;border-right:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle)}
  .lab{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
  .onlight{background:var(--gray-11)}
  .chips{display:flex;gap:8px}
  .chip{width:26px;height:26px;border-radius:6px;border:1px solid var(--border-subtle)}
</style></head>
<body>
<div class="wrap">
  <div class="cell"><span class="lab">Primary wordmark</span><img src="../assets/logo-wordmark.svg" height="56" alt="Drone Safety Platform" /></div>
  <div class="cell"><span class="lab">Mark</span><img src="../assets/logo-mark.svg" width="72" height="72" alt="mark" /></div>
  <div class="cell onlight" style="border-right:1px solid var(--border-default)"><span class="lab" style="color:#475160">Mark on light</span><img src="../assets/logo-mark.svg" width="64" height="64" alt="mark on light" /></div>
  <div class="cell"><span class="lab">Brand colours</span>
    <div class="chips">
      <div class="chip" style="background:var(--blue)"></div>
      <div class="chip" style="background:var(--gray-1)"></div>
      <div class="chip" style="background:var(--green)"></div>
      <div class="chip" style="background:var(--amber)"></div>
      <div class="chip" style="background:var(--red)"></div>
    </div>
  </div>
</div>
</body></html>
