<!-- @dsCard group="Colors" viewport="700x170" name="Accent — blue" subtitle="Active states, focus, key actions. Reserved from status semantics." -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:var(--bg-app)}
  body{padding:18px 20px;font-family:var(--font-sans);display:flex;gap:12px}
  .sw{flex:1;border-radius:var(--radius-md);border:1px solid var(--border-subtle);padding:10px;height:96px;display:flex;flex-direction:column;justify-content:space-between}
  .nm{font-size:11px;font-weight:600;letter-spacing:.04em}
  .hx{font-family:var(--font-mono);font-size:10px;opacity:.8}
  .tk{font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary)}
</style></head>
<body>
<div class="sw" style="background:var(--blue-bright);color:#04121f"><span class="nm">Bright</span><span class="hx">#5aa0ff</span></div>
<div class="sw" style="background:var(--blue);color:#fff"><span class="nm">Accent</span><span class="hx">#2f81f7</span></div>
<div class="sw" style="background:var(--blue-deep);color:#fff"><span class="nm">Deep</span><span class="hx">#1f6fe0</span></div>
<div class="sw" style="background:var(--blue-tint);color:var(--accent-text);border-color:var(--blue-line)"><span class="nm">Tint</span><span class="tk">--blue-tint</span></div>
<div class="sw" style="background:var(--blue-ink);color:var(--accent-text)"><span class="nm">Ink</span><span class="hx">#11233d</span></div>
</body></html>
