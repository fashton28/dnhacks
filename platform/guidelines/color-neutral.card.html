<!-- @dsCard group="Colors" viewport="700x150" name="Neutral ramp" subtitle="Cool charcoal — surfaces, borders, text. --gray-0 → --gray-12" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:var(--bg-app)}
  body{padding:18px 20px;font-family:var(--font-sans)}
  .ramp{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-default)}
  .sw{flex:1;height:64px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px}
  .n{font-family:var(--font-mono);font-size:10px;font-weight:600}
  .lbls{display:flex;gap:0;margin-top:6px}
  .lb{flex:1;text-align:center;font-family:var(--font-mono);font-size:9px;color:var(--text-tertiary)}
</style></head>
<body>
<div class="ramp" id="r"></div>
<div class="lbls" id="l"></div>
<script>
const vals=['#06070a','#0b0d11','#111419','#171b22','#1e232b','#272d37','#333a45','#475160','#6b7686','#98a3b3','#c4ccd6','#e6eaf0','#f6f8fb'];
document.getElementById('r').innerHTML=vals.map((v,i)=>`<div class="sw" style="background:${v}"><span class="n" style="color:${i>8?'#06070a':'#98a3b3'}">${i}</span></div>`).join('');
document.getElementById('l').innerHTML=vals.map((v)=>`<div class="lb">${v}</div>`).join('');
</script>
</body></html>
