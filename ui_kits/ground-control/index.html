<!-- @startingPoint section="Ground Control" subtitle="Full drone mission-control screen — interactive mock" viewport="1440x860" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eye in the Sky — Ground Control</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; height: 100%; background: var(--bg-app); }
  #root { height: 100vh; }
  input[type=range]{ -webkit-appearance:none; appearance:none; background:transparent; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--gray-5); border-radius:6px; border:2px solid var(--bg-app); }
  ::-webkit-scrollbar-track{ background:transparent; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="mock.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="StatusBar.jsx"></script>
<script type="text/babel" src="VideoPanel.jsx"></script>
<script type="text/babel" src="ControlsPanel.jsx"></script>
<script type="text/babel" src="ManualControl.jsx"></script>
<script type="text/babel" src="TelemetryPanel.jsx"></script>
<script type="text/babel" src="MapPanel.jsx"></script>
<script type="text/babel" src="LogConsole.jsx"></script>
<script type="text/babel" src="Modals.jsx"></script>
<script type="text/babel" src="GroundControl.jsx"></script>
<script type="text/babel" data-presets="react">
  const mount = () => {
    if (!window.GroundControl) { setTimeout(mount, 30); return; }
    const App = window.GroundControl;
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  };
  mount();
</script>
</body>
</html>
