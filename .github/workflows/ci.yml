name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # =========================================================================
  # Job 1: UI — Node.js typecheck + lint + production build
  # =========================================================================
  ui:
    name: "UI (Node)"
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: ground/ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ground/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build (tsc + vite)
        run: npm run build

      - name: Upload build artefact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: ground-ui-dist
          path: ground/ui/dist/
          retention-days: 7

  # =========================================================================
  # Job 2: Companion — Python lint + unit tests
  # =========================================================================
  companion:
    name: "Companion (Python)"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: companion/pyproject.toml

      - name: Install companion[dev]
        run: pip install -e "companion[dev]"

      - name: Lint with ruff
        run: python -m ruff check companion/src companion/tests sim/
        continue-on-error: false

      - name: Lint with pyflakes (secondary check)
        run: python -m pyflakes companion/src/
        continue-on-error: true

      - name: Run unit tests (pytest)
        run: python -m pytest companion/tests -v --tb=short

  # =========================================================================
  # Job 3: SITL e2e — installs ArduPilot + runs headless acceptance demo
  # Best-effort / manual trigger only; allowed to fail on infra issues.
  # =========================================================================
  sitl-e2e:
    name: "SITL e2e (optional)"
    runs-on: ubuntu-22.04
    # Only run on explicit workflow_dispatch, or when commit message includes [e2e]
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[e2e]')
    continue-on-error: true  # heavy install; don't fail the whole pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: companion/pyproject.toml

      - name: Install companion[dev]
        run: pip install -e "companion[dev]"

      - name: Install ArduPilot prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git python3-dev python3-pip python3-venv \
            gcc g++ make cmake \
            libxml2-dev libxslt1-dev zlib1g-dev \
            mavproxy ccache
        timeout-minutes: 10

      - name: Cache ArduPilot SITL build
        uses: actions/cache@v4.1.2
        id: ardupilot-cache
        with:
          path: ~/ardupilot
          key: ardupilot-Copter-4.5.7-${{ runner.os }}-v1

      - name: Clone + build ArduPilot SITL
        if: steps.ardupilot-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch Copter-4.5.7 --depth 1 \
              --recurse-submodules \
              https://github.com/ArduPilot/ardupilot.git ~/ardupilot
          cd ~/ardupilot
          Tools/environment_install/install-prereqs-ubuntu.sh -y || true
          source ~/.profile || true
          python3 waf configure --board sitl
          python3 waf copter -j$(nproc)
        timeout-minutes: 40

      - name: Add ArduPilot autotest to PATH
        run: |
          echo "$HOME/ardupilot/Tools/autotest" >> $GITHUB_PATH
          echo "ARDUPILOT_HOME=$HOME/ardupilot" >> $GITHUB_ENV

      - name: Run SITL e2e acceptance demo
        run: bash scripts/run-sim-e2e.sh
        timeout-minutes: 10
        env:
          EIS_E2E_TIMEOUT: "90"
