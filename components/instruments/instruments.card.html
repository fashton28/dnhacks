<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; background: var(--bg-app); }
  body { padding: 20px; font-family: var(--font-sans); }
  .grid { display: flex; align-items: flex-start; gap: 28px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 14px; width: 200px; }
</style>
</head>
<body>
<div id="root" class="eis-root"></div>
<script type="text/babel">
const { AttitudeIndicator, Compass, BatteryGauge, SignalGauge } = window.EyeInTheSkyDesignSystem_c7577a;
function Demo() {
  const [t, setT] = React.useState(0);
  React.useEffect(() => { const id = setInterval(() => setT(x => x + 0.05), 50); return () => clearInterval(id); }, []);
  const roll = Math.sin(t) * 18;
  const pitch = Math.cos(t * 0.7) * 8;
  const heading = (t * 12) % 360;
  return (
    <div className="grid">
      <AttitudeIndicator roll={roll} pitch={pitch} size={170} />
      <Compass heading={heading} size={170} target={(heading + 60) % 360} />
      <div className="col">
        <BatteryGauge remaining={74} voltage={15.8} current={12.3} cells={4} />
        <BatteryGauge remaining={24} voltage={14.2} current={18.1} cells={4} />
        <div style={{display:'flex', gap: 20, marginTop: 4}}>
          <SignalGauge rssi={-52} latencyMs={42} />
          <SignalGauge lost />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
